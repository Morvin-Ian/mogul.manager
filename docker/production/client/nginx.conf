server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Resolving at request time (via the $upstream
    # variable below) instead of at startup means this container boots even
    # when mogul-api is still starting, and it picks up the new IP when the
    # api container is recreated rather than caching a dead one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api http://mogul-api:8000;

    # Matches settings.max_upload_size_bytes (5 MiB) with headroom for the
    # multipart envelope; raise both together if you raise one.
    client_max_body_size 8M;

    # Every backend route is mounted under /api (see routes/*.py prefixes).
    # A variable in proxy_pass suppresses nginx's automatic URI pass-through,
    # so $request_uri (full original path + query) is appended by hand.
    location /api/ {
        proxy_pass $upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;

        # /api/notifications/stream and the chat endpoint both return
        # text/event-stream. Buffering here would hold each event until the
        # response closed, i.e. forever.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location = /health {
        proxy_pass $upstream_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Vue history-mode router: unknown paths are client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
